{% extends "base.html" %}
{% block title %}Log in — AR Review{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/review/login" class="stack">
  <label>Your name <input type="text" name="name" required autofocus></label>
  <label>Shared password <input type="password" name="password" required></label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
