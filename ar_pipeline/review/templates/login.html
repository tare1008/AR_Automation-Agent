{% extends "base.html" %}
{% block title %}Log in — AR Review{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="brand-mark">AR</span>
    <h1>Sign in</h1>
    <p class="lede">Use your name and the team's shared review password to open the queue.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/review/login" class="stack">
      <label class="field"><span>Your name</span>
        <input type="text" name="name" required autofocus autocomplete="username">
      </label>
      <label class="field"><span>Shared password</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
